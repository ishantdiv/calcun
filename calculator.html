<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple Calculator</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #f1f3f5;
      font-family: system-ui, sans-serif;
    }

    .calculator {
      width: min(320px, 92vw);
      padding: 20px;
      border-radius: 16px;
      background: #20232a;
      box-shadow: 0 12px 30px #0003;
    }

    #display {
      width: 100%;
      height: 72px;
      margin-bottom: 14px;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #fff;
      color: #20232a;
      font: 2rem ui-monospace, monospace;
      text-align: right;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    button {
      min-height: 58px;
      border: 0;
      border-radius: 8px;
      background: #3a3f4b;
      color: white;
      font: 1.25rem system-ui, sans-serif;
      cursor: pointer;
    }

    button:hover { background: #505665; }
    button:active { transform: scale(0.97); }
    button.operator { background: #e58b2a; }
    button.operator:hover { background: #f0a244; }
    button.utility { background: #606775; }
    button.equals { grid-row: span 2; background: #2b9b70; }
    button.zero { grid-column: span 2; }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <input id="display" aria-label="Display" value="0" readonly>
    <div class="keys">
      <button class="utility" data-action="clear">AC</button>
      <button class="utility" data-action="delete">DEL</button>
      <button class="operator" data-operator="/">÷</button>
      <button class="operator" data-operator="*">×</button>

      <button data-digit="7">7</button>
      <button data-digit="8">8</button>
      <button data-digit="9">9</button>
      <button class="operator" data-operator="-">−</button>

      <button data-digit="4">4</button>
      <button data-digit="5">5</button>
      <button data-digit="6">6</button>
      <button class="operator" data-operator="+">+</button>

      <button data-digit="1">1</button>
      <button data-digit="2">2</button>
      <button data-digit="3">3</button>
      <button class="equals" data-action="equals">=</button>

      <button class="zero" data-digit="0">0</button>
      <button data-action="decimal">.</button>
    </div>
  </main>

  <script>
    const display = document.querySelector("#display");
    let current = "0";
    let stored = null;
    let operator = null;
    let startNewNumber = false;

    function updateDisplay() {
      display.value = current;
    }

    function enterDigit(digit) {
      if (current === "Error" || startNewNumber) {
        current = digit;
        startNewNumber = false;
      } else {
        current = current === "0" ? digit : current + digit;
      }
      updateDisplay();
    }

    function calculate(a, op, b) {
      switch (op) {
        case "+": return a + b;
        case "-": return a - b;
        case "*": return a * b;
        case "/": return b === 0 ? NaN : a / b;
        default: return b;
      }
    }

    function formatResult(value) {
      if (!Number.isFinite(value)) return "Error";
      return String(Number(value.toPrecision(10)));
    }

    function chooseOperator(nextOperator) {
      const value = Number(current);
      if (operator && !startNewNumber) {
        current = formatResult(calculate(stored, operator, value));
        updateDisplay();
      } else {
        current = formatResult(value);
      }

      stored = Number(current);
      operator = nextOperator;
      startNewNumber = true;
    }

    function equals() {
      if (operator === null || startNewNumber) return;
      current = formatResult(calculate(stored, operator, Number(current)));
      stored = null;
      operator = null;
      startNewNumber = true;
      updateDisplay();
    }

    function clear() {
      current = "0";
      stored = null;
      operator = null;
      startNewNumber = false;
      updateDisplay();
    }

    function handleAction(action) {
      if (action === "clear") clear();
      if (action === "equals") equals();
      if (action === "decimal" && current !== "Error") {
        if (startNewNumber) {
          current = "0.";
          startNewNumber = false;
        } else if (!current.includes(".")) {
          current += ".";
        }
        updateDisplay();
      }
      if (action === "delete" && current !== "Error") {
        current = startNewNumber ? "0" : (current.length > 1 ? current.slice(0, -1) : "0");
        startNewNumber = false;
        updateDisplay();
      }
    }

    document.querySelector(".keys").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      if (button.dataset.digit) enterDigit(button.dataset.digit);
      if (button.dataset.operator) chooseOperator(button.dataset.operator);
      if (button.dataset.action) handleAction(button.dataset.action);
    });

    document.addEventListener("keydown", (event) => {
      if (/^\d$/.test(event.key)) enterDigit(event.key);
      else if (["+", "-", "*", "/"].includes(event.key)) chooseOperator(event.key);
      else if (event.key === ".") handleAction("decimal");
      else if (event.key === "Enter" || event.key === "=") equals();
      else if (event.key === "Backspace") handleAction("delete");
      else if (event.key === "Escape") clear();
    });
  </script>
</body>
</html>
